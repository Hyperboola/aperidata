# Calendario editoriale di aperidata
#
# Ogni giorno ha un macro-tema e dei sottotemi che ruotano: ogni settimana tocca al sottotema usato meno di
# recente. Accanto a ogni sottotema ci sono le categorie del catalogo ISTAT da cui pescare i dataset (ogni
# codice include le sue sottocategorie). Per cercarne altre: python -m pipeline.categorie --cerca <parola>

# Fasce di dati che si possono pubblicare: "annuale", "trimestrale", "mensile"
slot = ["annuale", "mensile"]

# Post al giorno (da 1 a 3). Con 1, le fasce si alternano: si parte da quella pubblicata meno di recente,
# e se non c'è niente si passa alla successiva.
post_al_giorno = 1

# Un dataset si usa una volta sola. Quando un sottotema li ha esauriti, una serie può tornare solo con un
# dato nuovo e non prima di queste settimane.
pausa_settimane = 8

# Come raccontare ogni sottotema.
#   storia: "serie" (un fenomeno nel tempo) o "confronto" (le aree d'Italia nell'ultimo anno)
#   grafico: per le serie "linea", "colonne" o "area"; per i confronti "barre" o "ciambella"
# Se il grafico non è adatto ai dati del giorno, il codice usa il più adatto. Si cambia anche in redazione.
[racconto]
default             = { storia = "serie", grafico = "linea" }
prezzi              = { storia = "serie", grafico = "colonne" }
stipendi_redditi    = { storia = "confronto", per = "territorio", grafico = "barre" }
poverta_disuguaglianze = { storia = "confronto", per = "territorio", grafico = "barre" }
occupazione         = { storia = "confronto", per = "territorio", grafico = "barre" }
nascite             = { storia = "serie", grafico = "linea" }
invecchiamento      = { storia = "serie", grafico = "area" }
stranieri           = { storia = "confronto", per = "territorio", grafico = "barre" }
casa_affitti        = { storia = "serie", grafico = "colonne" }
turismo             = { storia = "confronto", per = "territorio", grafico = "barre" }
tecnologia_internet = { storia = "serie", grafico = "colonne" }

# Età massima dell'ultimo dato, in mesi dalla fine del periodo
[freschezza]
annuale = 24
trimestrale = 8
mensile = 6

# Quanti periodi mostrare nel grafico (13 mesi e 12 trimestri includono l'anno prima)
[finestra]
annuale = 10
trimestrale = 20
mensile = 13

# Temi mai scelti in automatico: richiedono una scelta editoriale umana
[esclusi]
categorie = [
    "POLITICAL_PART",    # partecipazione politica
    "DCIS_SUICIDI",      # suicidi
    "HEA_WOMHEALT",      # interruzioni di gravidanza
    "GENDER_VIOL",       # violenza sulle donne
    "JUS_CRIMINAL",      # reati e procedimenti penali
    "SOC_ACT_RELIG",     # pratica religiosa
]

[giorni.lunedi]
